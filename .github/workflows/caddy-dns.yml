name: Build caddy-dns

on:
  push:
    paths:
      - 'images/caddy-dns/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

env:
  IMAGE_NAME: caddy-dns

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Caddy version
        id: version
        run: |
          # 从 Dockerfile 提取基础镜像版本，然后查询实际 Caddy 版本
          CADDY_VERSION=$(docker run --rm caddy:2 caddy version 2>&1 | awk '{print $3}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$CADDY_VERSION" ]; then
            # 备用方案：使用 curl 查询最新 caddy 版本
            CADDY_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=100" | grep -oE '"name":"2\.[0-9]+\.[0-9]+"' | head -1 | cut -d'"' -f4)
          fi
          echo "version=${CADDY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Caddy version: ${CADDY_VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: images/caddy-dns
          push: true
          tags: |
            ghcr.io/phpgao/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/phpgao/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
