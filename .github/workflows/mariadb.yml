name: Build mariadb

on:
  push:
    paths:
      - 'images/mariadb/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

env:
  IMAGE_NAME: mariadb

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile
        id: version
        run: |
          MARIADB_VERSION=$(grep "ARG MARIADB_VERSION=" images/mariadb/Dockerfile | cut -d'=' -f2 | tr -d '\r')
          echo "version=${MARIADB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "MariaDB version: ${MARIADB_VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: images/mariadb
          push: true
          tags: |
            ghcr.io/phpgao/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/phpgao/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
